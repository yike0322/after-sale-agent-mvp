spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
  ai:
    vectorstore:
      type: qdrant
      qdrant:
        host: ${QDRANT_HOST}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: after_sale_knowledge
        use-tls: false
        # Spring AI 1.1.2 intentionally uses the built-in Qdrant doc_content field.
        initialize-schema: true

aftersale:
  demo-auth:
    hmac-secret: ${DEMO_AUTH_HMAC_SECRET}
